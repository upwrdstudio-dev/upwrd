<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UPWRD Studio — Digital Studio for Malaysian SMEs</title>
    <meta name="description" content="UPWRD Studio designs and builds websites and social media design for Malaysian small businesses." />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/upwrd-app-icon.png" />
    <script>
      // The prerendered page paints before JavaScript loads. On a desktop
      // first visit the intro animation will cover it, so hide it until then
      // rather than flashing the page first. Mirrors shouldPlayIntro in src/lib/intro.ts.
      try {
        if (
          !location.pathname.startsWith('/concepts/') &&
          matchMedia('(min-width: 768px) and (pointer: fine)').matches &&
          sessionStorage.getItem('upwrd-intro-seen') !== '1'
        )
          document.documentElement.classList.add('intro')
      } catch (e) {}
    </script>
    <style>
      html.intro body { background: #0a0a0a }
      html.intro [data-prerendered] { visibility: hidden }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
